name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to the same branch cancels the run that's now out of date.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to commit SHAs. Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fail on known high or critical vulnerabilities in code that ships to Lambda.
      - run: npm audit --omit=dev --audit-level=high
      # Type check, lint, bundle, unit + infra tests, then synth with cdk-nag.
      - run: npm run check

  dynamodb-local:
    # The ledger's conditional writes and the end-to-end flow, on a real DynamoDB engine,
    # then the mutation check (two of its mutants need DynamoDB Local).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.2
        ports:
          - 8025:8000
    env:
      AWS_ENDPOINT_URL_DYNAMODB: http://localhost:8025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:int
      # Break each safeguard once and check that a test notices.
      - run: npm run mutate
